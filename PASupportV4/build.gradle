apply plugin: 'com.android.library'
android {
    buildFeatures {
        buildConfig true
    }
    compileSdk 37

    defaultConfig {
        minSdk 21
        targetSdk 37
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
    namespace 'android.support.v42'
}

dependencies {
}