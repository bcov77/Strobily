apply plugin: 'com.android.application'

android {
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
    }
    compileSdk 37
    defaultConfig {
        applicationId "com.tp77.Strobe"
        minSdk 21
        targetSdk 37
        versionCode 56
        versionName '2.2.7'

        testInstrumentationRunner "com.tp77.Strobe.BrightnessInstrumentation"

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    productFlavors {
    }
    namespace 'com.tp77.Strobe'
}

dependencies {
    androidTestImplementation project(':PASupportV4')
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':StrobeLib')
    implementation 'com.android.support:support-v4:28.0.0'
}
